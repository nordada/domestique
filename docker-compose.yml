# Compose file for running Domestique - works on any Docker host (Unraid,
# Synology, plain Linux, macOS via Docker Desktop/Colima, etc).
#
# All host-specific values (paths, port) live in .env, not here - copy
# .env.example to .env and fill it in before running `docker compose up`.
#
# IMPORTANT: the "dir" value Transmission passes to torrent-done.sh (via
# TR_TORRENT_DIR) has to resolve to the same file inside THIS container as it
# does inside Transmission's own container. Transmission's own Docker
# template maps its downloads share to /downloads internally (on Unraid,
# check your Transmission container's path mappings in the Docker tab;
# elsewhere, check its own compose file/run command), so this container
# mounts the SAME host directory at that SAME container path below -
# DOWNLOADS_DIR in .env is the host path, but it always lands at the fixed
# container path /downloads here, matching Transmission's side. If your
# Transmission container uses a different internal path, change the
# ":/downloads" below to match it instead.
#
# "name" is pinned explicitly (rather than left to default to the containing
# folder's basename) so the Compose project identity - and therefore this
# container's lifecycle management - stays stable even if the deployment
# folder on the host gets renamed or moved.
name: domestique
services:
  domestique:
    build: .
    container_name: domestique
    restart: unless-stopped
    # Unraid's Docker manager can't attach a template to compose-managed
    # containers, so it reads these labels instead: without an icon it renders
    # a "?" fallback that 404s in nginx and spams the Unraid syslog on every
    # Dashboard refresh. Harmless on non-Unraid hosts. [IP]/[PORT:n] are
    # Unraid placeholders it fills in when building the WebUI link.
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/nordada/domestique/main/public/icon.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:${PORT}]/ui"
    ports:
      - "${PORT}:${PORT}"
    environment:
      LIBRARY_ROOT: ${LIBRARY_ROOT}
      # Defaulted (:-...) rather than required, unlike LIBRARY_ROOT above -
      # a real incident on upgrade: an existing .env predating a new
      # container-path var (DEDUPE_STATE_CONTAINER_PATH) left it unset,
      # which docker-compose expands to an empty string, producing an
      # "invalid spec: ./config/dedupe-state.json:: empty section between
      # colons" failure. These defaults match .env.example's own values, so
      # an existing install missing any of these on upgrade just falls back
      # to what a fresh install would already use, instead of failing.
      CONFIG_PATH: ${CONFIG_CONTAINER_PATH:-/app/config/events.json}
      SETTINGS_PATH: ${SETTINGS_CONTAINER_PATH:-/app/config/settings.json}
      ACTIVITY_PATH: ${ACTIVITY_CONTAINER_PATH:-/app/config/activity.json}
      DEDUPE_STATE_PATH: ${DEDUPE_STATE_CONTAINER_PATH:-/app/config/dedupe-state.json}
      VERIFY_STATE_PATH: ${VERIFY_STATE_CONTAINER_PATH:-/app/config/verify-state.json}
      MATCH_OVERRIDES_PATH: ${MATCH_OVERRIDES_CONTAINER_PATH:-/app/config/match-overrides.json}
      TORRENT_REGISTRY_DIR: ${TORRENT_REGISTRY_CONTAINER_PATH:-/app/config/torrent-registry}
      PORT: "${PORT}"
      # Optional Plex/Discord/hot-folder integrations - safe to leave unset,
      # the app just disables each feature when its required vars aren't all
      # present. These are a ONE-TIME SEED ONLY: the first time
      # config/settings.json doesn't exist yet, it's created from whatever's
      # set here; after that the file is authoritative and these env vars are
      # ignored, since the web UI's Settings panel is the live way to change
      # them from then on (see the README).
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_SECTION_ID: ${PLEX_SECTION_ID:-}
      PLEX_LIBRARY_ROOT: ${PLEX_LIBRARY_ROOT:-}
      HOTFOLDER_DIR: ${HOTFOLDER_DIR:-}
      HOTFOLDER_POLL_INTERVAL_MS: ${HOTFOLDER_POLL_INTERVAL_MS:-}
      HOTFOLDER_STABLE_POLLS: ${HOTFOLDER_STABLE_POLLS:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_MENTION_USER_ID: ${DISCORD_MENTION_USER_ID:-}
      # Optional: syncs every .torrent Transmission itself has ever been
      # handed (including anything autobrr added directly, never touching
      # Domestique) into Domestique's own torrent registry - see the
      # README's "Torrent registry" section. Uses ":+" (the opposite of the
      # ":-" defaults elsewhere in this block) deliberately: the container
      # path below is fixed and always mounted (see the volumes: block), but
      # the app itself needs to be able to tell "not configured" apart from
      # "configured at this path" - ":+" makes this var genuinely empty
      # (feature off) whenever TRANSMISSION_TORRENTS_HOST_DIR is unset,
      # rather than always resolving to the fixed container path regardless.
      TRANSMISSION_TORRENTS_DIR: ${TRANSMISSION_TORRENTS_HOST_DIR:+/transmission-torrents}
      # Optional web UI (config editor, match tester, activity log) at
      # /ui. Unlike the integrations above, leaving this unset does NOT
      # leave the UI reachable without a password - its routes respond 503
      # until WEBUI_PASSWORD is set, since it exposes read/write config
      # access over HTTP.
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
      WEBUI_USER: ${WEBUI_USER:-}
      # Optional: run the app as this user/group instead of root
      # (linuxserver.io-style PUID/PGID convention; on Unraid 99/100 is the
      # usual nobody:users pair). Unset = run as root, the original
      # behavior. BEFORE enabling on an existing install, read the README's
      # "Running as a non-root user" section - the library (and hot-folder,
      # if used) need a one-time chown or the app can't write to them.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    volumes:
      # Transmission's completed-downloads share. Mounted at /downloads to
      # match Transmission's own internal path. Read-write: the normal
      # ingestion pipeline only ever copies FROM here, but the Reseed tab's
      # Dedupe feature deletes a torrent's original download-folder copy
      # once it's confirmed hardlinked to the library instead (a deliberate,
      # explicit, two-click-confirmed action - see the README's "Currently
      # seeding" section). Was read-only before that feature existed; if
      # you'd rather keep this share fully read-only and just skip Dedupe's
      # delete step, add ":ro" back here - "Delete original copy" will then
      # fail with EROFS instead (relinking/verifying itself doesn't need
      # write access here, only that one explicit follow-up action does).
      - ${DOWNLOADS_DIR}:/downloads
      # Hot-folder drop zone: a more specific bind mount layered on top of
      # the one above, kept for its own isolation (only this subtree needs
      # to exist/be written to for hot-folder ingestion's processed/
      # subfolder) even though both are read-write now. Only takes effect
      # if HOTFOLDER_DIR is set to this same path in .env; otherwise it's
      # just an unused empty directory.
      - ${DOWNLOADS_DIR}/domestique:/downloads/domestique
      # Plex library root (read-write: this is where renamed files land).
      - ${LIBRARY_ROOT}:${LIBRARY_ROOT}
      # Config file bind-mounted so you can edit show mappings without rebuilding the image.
      # Defaulted (:-...), same reasoning as the environment: block above -
      # an unset var here produces an "empty section between colons" bind-
      # mount failure, not a silent no-op, so these can't be left required.
      - ./config/events.json:${CONFIG_CONTAINER_PATH:-/app/config/events.json}
      # Plex/Discord/hot-folder settings, editable live via the web UI's
      # Settings panel - bind-mounted so edits (and the one-time seed from
      # the PLEX_*/DISCORD_*/HOTFOLDER_* env vars above) persist across
      # container recreation. Gitignored: unlike events.json this holds live
      # secrets once set.
      # IMPORTANT (first run only): unlike events.json, this file doesn't
      # ship in the repo - if ./config/settings.json doesn't exist on the
      # HOST before the very first `docker compose up`, Docker creates an
      # empty DIRECTORY there instead of a file (a well-known bind-mount
      # gotcha), which the app can't clean up from inside the container
      # (it's the actual mount point). Avoid it entirely with `touch
      # config/settings.json` before your first `docker compose up` here.
      - ./config/settings.json:${SETTINGS_CONTAINER_PATH:-/app/config/settings.json}
      # Recent-activity log (Home tab / Discord messages), bind-mounted so it
      # survives container recreation and restarts - previously in-memory
      # only, so a restart (e.g. a scheduled appdata-backup plugin stopping
      # and starting all containers) silently wiped it. Same first-run
      # gotcha as settings.json above: `touch config/activity.json` before
      # your first `docker compose up` here.
      - ./config/activity.json:${ACTIVITY_CONTAINER_PATH:-/app/config/activity.json}
      # Records where a deduped torrent's data lived before Dedupe relinked
      # it (see seeding.ts's findOrphanOriginal) - Transmission itself
      # forgets a torrent's previous location once relocated, so this has
      # to be Domestique's own persisted state instead of a live query.
      # Same first-run gotcha as settings.json/activity.json above: `touch
      # config/dedupe-state.json` before your first `docker compose up` here.
      - ./config/dedupe-state.json:${DEDUPE_STATE_CONTAINER_PATH:-/app/config/dedupe-state.json}
      # Index tab's "Verify data" integrity-check results (see verifyState.ts)
      # - was never bind-mounted at all until this line existed, so every
      # container recreation silently reset it to empty and any prior verify
      # run looked like it had never happened. Same first-run gotcha as
      # settings.json/activity.json above: `touch config/verify-state.json`
      # before your first `docker compose up` here.
      - ./config/verify-state.json:${VERIFY_STATE_CONTAINER_PATH:-/app/config/verify-state.json}
      # A human's own picks from the Index tab's "Resolve ambiguous files"
      # modal (see matchOverrides.ts) - same story as verify-state.json just
      # above: never bind-mounted, so a resolved pick silently reverted to
      # "ambiguous" again on the next container recreation. Same first-run
      # gotcha: `touch config/match-overrides.json` before your first
      # `docker compose up` here.
      - ./config/match-overrides.json:${MATCH_OVERRIDES_CONTAINER_PATH:-/app/config/match-overrides.json}
      # Durable copy of every .torrent Domestique has a record of (staged
      # through the Index tab, or synced in from Transmission's own torrents
      # directory below), keyed by info-hash (see torrentRegistry.ts) - lets
      # you download any of them back later and skip re-processing an
      # already-registered one on a repeat batch drop. A directory mount,
      # not a single file, so there's no first-run empty-directory gotcha
      # like the file mounts above: Docker creating a directory here is
      # exactly what's wanted.
      - ./config/torrent-registry:${TORRENT_REGISTRY_CONTAINER_PATH:-/app/config/torrent-registry}
      # Optional, read-only: Transmission's OWN .torrent-storage directory
      # (see the README's "Torrent registry" section for how to find it) -
      # lets Domestique capture every torrent Transmission has ever been
      # handed, including anything autobrr added directly. Defaults to a
      # harmless local placeholder (Docker auto-creates it empty, same as
      # any other missing bind-mount source) when TRANSMISSION_TORRENTS_HOST_DIR
      # is unset, so this line is always syntactically valid regardless -
      # the app-side TRANSMISSION_TORRENTS_DIR env var above (not this mount
      # itself) is what actually toggles the sync feature on/off.
      - ${TRANSMISSION_TORRENTS_HOST_DIR:-./config/.transmission-torrents-empty}:/transmission-torrents:ro
      # Web UI static assets, bind-mounted read-only for the same reason as
      # config/events.json above - HTML/CSS/JS tweaks take effect on the next
      # request without an image rebuild.
      - ./public:/app/public:ro
